<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Level Up Tracker</title>
    <style>
        :root {
            --bg: #121215;
            --surface: #1e1e24;
            --primary: #4ade80;
            --text: #ffffff;
            --text-muted: #8b8b99;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .level-badge {
            display: inline-block;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: black;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.3);
        }
        .progress-container {
            background: #333;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .habit-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s ease;
        }
        .habit-card:active {
            transform: scale(0.98);
        }
        .habit-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .habit-info p {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
        }
        /* Chillige Checkbox */
        input[type="checkbox"] {
            appearance: none;
            width: 28px;
            height: 28px;
            border: 2px solid var(--text-muted);
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        input[type="checkbox"]:checked {
            background-color: var(--primary);
            border-color: var(--primary);
            animation: pop 0.3s ease;
        }
        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: #121215;
            font-size: 18px;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .floating-xp {
            position: fixed;
            color: var(--primary);
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s forwards;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="level-badge" id="level-display">Level 1</div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted);">
            <span>XP für nächstes Level</span>
            <span id="xp-text">0 / 100</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="xp-bar"></div>
        </div>
    </div>

    <div id="habits-container">
        </div>

    <script>
        // Startwerte
        let xp = parseInt(localStorage.getItem('habitXP')) || 0;
        let level = parseInt(localStorage.getItem('habitLevel')) || 1;
        let nextLevelXP = level * 100;

        // Unsere Habits
        const habits = [
            { id: 'gym', name: 'Gym / Workout 💪', xp: 50 },
            { id: 'water', name: '2L Wasser trinken 💧', xp: 20 },
            { id: 'read', name: '10 Seiten lesen 📚', xp: 30 },
            { id: 'meditate', name: 'Meditation 🧘‍♂️', xp: 40 }
        ];

        const container = document.getElementById('habits-container');
        const xpBar = document.getElementById('xp-bar');
        const xpText = document.getElementById('xp-text');
        const levelDisplay = document.getElementById('level-display');

        // Heutiges Datum als Schlüssel zum Speichern
        const today = new Date().toISOString().split('T')[0];

        function updateUI() {
            nextLevelXP = level * 100;
            const percentage = (xp / nextLevelXP) * 100;
            xpBar.style.width = percentage + '%';
            xpText.innerText = `${xp} / ${nextLevelXP} XP`;
            levelDisplay.innerText = `Level ${level}`;
            
            // Speichern
            localStorage.setItem('habitXP', xp);
            localStorage.setItem('habitLevel', level);
        }

        function showFloatingXP(amount, x, y) {
            const el = document.createElement('div');
            el.className = 'floating-xp';
            el.innerText = `+${amount} XP ✨`;
            el.style.left = (x - 20) + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function toggleHabit(habit, checkbox, event) {
            const storageKey = `habit_${habit.id}_${today}`;
            
            if (checkbox.checked) {
                // Haken gesetzt
                xp += habit.xp;
                localStorage.setItem(storageKey, 'true');
                showFloatingXP(habit.xp, event.clientX, event.clientY);
                
                // Level Up Check
                if (xp >= nextLevelXP) {
                    xp = xp - nextLevelXP;
                    level++;
                    setTimeout(() => alert(`🎉 LEVEL UP! Du bist jetzt Level ${level}!`), 300);
                }
            } else {
                // Haken entfernt
                xp -= habit.xp;
                if (xp < 0) xp = 0; // Kein negatives XP
                localStorage.setItem(storageKey, 'false');
            }
            updateUI();
        }

        // App initialisieren
        habits.forEach(habit => {
            const storageKey = `habit_${habit.id}_${today}`;
            const isDone = localStorage.getItem(storageKey) === 'true';

            const card = document.createElement('div');
            card.className = 'habit-card';
            card.innerHTML = `
                <div class="habit-info">
                    <h3>${habit.name}</h3>
                    <p>+${habit.xp} XP</p>
                </div>
                <input type="checkbox" id="${habit.id}" ${isDone ? 'checked' : ''}>
            `;
            container.appendChild(card);

            const checkbox = card.querySelector('input');
            checkbox.addEventListener('change', (e) => toggleHabit(habit, checkbox, e));
        });

        updateUI();
    </script>
</body>
</html>
